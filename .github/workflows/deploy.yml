name: Deploy to Firebase

on: [push, workflow_dispatch]

permissions:
  contents: read
  id-token: write

env:
  # Firebase expects PROJECT ID, not project number
  FIREBASE_PROJECT_ID: executive-function-coaching
  CLOUD_RUN_SERVICE: telegram-webhook
  CLOUD_RUN_REGION: us-central1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          cd functions
          python -m venv venv
          source venv/bin/activate
          pip install -U pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Tests
        working-directory: functions
        run: |
          source venv/bin/activate
          pytest -q
        env:
          CLOUDSDK_PYTHON: ${{ github.workspace }}/functions/venv/bin/python
          PYTHONPATH: ${{ github.workspace }}/functions
  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.FIREBASE_PROJECT_ID }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies and Deploy
        run: |
          cd functions
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt

          # Sanity check
          python -c "import firebase_functions; print(f'SDK location: {firebase_functions.__file__}')"

          cd ..
          npx -y firebase-tools@latest deploy \
            --project "${{ env.FIREBASE_PROJECT_ID }}" \
            --only functions \
            --force
        env:
          CLOUDSDK_PYTHON: ${{ github.workspace }}/functions/venv/bin/python

      - name: Rebind Secrets to Cloud Run
        run: |
          # Firebase Deploy (Gen2) can wipe out existing secret bindings, so we re-apply them.
          gcloud run services update "${{ env.CLOUD_RUN_SERVICE }}" \
            --project "${{ env.FIREBASE_PROJECT_ID }}" \
            --region "${{ env.CLOUD_RUN_REGION }}" \
            --update-secrets "TELEGRAM_TOKEN=TELEGRAM_TOKEN:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest"
