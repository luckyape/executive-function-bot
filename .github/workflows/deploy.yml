name: Deploy to Firebase

on: [push, workflow_dispatch]

# PERMISSIONS REQUIRED FOR OIDC (Keyless Auth)
permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # AUTHENTICATE WITH GOOGLE (The new way)
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          # CHANGE THIS LINE:
          workload_identity_provider: '${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}'
          # CHANGE THIS LINE TOO:
          service_account: '${{ secrets.SERVICE_ACCOUNT_EMAIL }}'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          if [ -f functions/requirements.txt ]; then pip install -r functions/requirements.txt; else pip install -r requirements.txt; fi

      - name: Deploy to Firebase
        # NOTICE: No --token flag here. It uses the active session from the step above.
        run: npx firebase-tools deploy --project 218883677076 --only functions --force
      - name: Create venv and Install Dependencies
        run: |
          cd functions
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
