name: Deploy to Firebase

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # This allows you to click a button to force-run it

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Deploy to Firebase
        # Uses the token you generated in Cloud Shell + Your specific Project ID
        run: npx firebase-tools deploy --project 218883677076 --only functions --token "${{ secrets.FIREBASE_TOKEN }}" --force
