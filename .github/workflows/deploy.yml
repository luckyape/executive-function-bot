name: Deploy to Firebase

on: [push, workflow_dispatch]

permissions:
  contents: read
  id-token: write

env:
  # Firebase expects PROJECT ID, not project number
  FIREBASE_PROJECT_ID: executive-function-coaching

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}

      # This is the missing piece if you later call `gcloud`
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.FIREBASE_PROJECT_ID }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies and Deploy
        run: |
          cd functions
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt

          # Sanity check
          python -c "import firebase_functions; print(f'SDK location: {firebase_functions.__file__}')"

          cd ..
          npx -y firebase-tools@latest deploy \
            --project "${{ env.FIREBASE_PROJECT_ID }}" \
            --only functions \
            --force
        env:
          CLOUDSDK_PYTHON: ${{ github.workspace }}/functions/venv/bin/python
