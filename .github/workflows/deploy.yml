name: Deploy to Firebase

on: [push, workflow_dispatch]

permissions:
  contents: read
  id-token: write

env:
  # Firebase expects PROJECT ID, not project number
  FIREBASE_PROJECT_ID: executive-function-coaching
  CLOUD_RUN_SERVICE: telegram-webhook
  CLOUD_RUN_REGION: us-central1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Debug auth target
        run: |
          echo "GOOGLE_APPLICATION_CREDENTIALS=$GOOGLE_APPLICATION_CREDENTIALS"
          python - <<'PY'
          import json, os, re
          p = os.environ.get("GOOGLE_APPLICATION_CREDENTIALS")
          print("creds_file:", p)
          with open(p) as f:
            j = json.load(f)
          url = j.get("service_account_impersonation_url","")
          print("impersonation_url:", url)
          m = re.search(r"/serviceAccounts/([^:]+@[^/]+)", url)
          print("IMPERSONATED_SA:", m.group(1) if m else "")
          print("audience:", j.get("audience",""))
          PY
          echo "WIP_SECRET=${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}"
          echo "SA_SECRET=${{ secrets.SERVICE_ACCOUNT_EMAIL }}"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.FIREBASE_PROJECT_ID }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies and Deploy
        run: |
          cd functions
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt

          # Sanity check
          python -c "import firebase_functions; print(f'SDK location: {firebase_functions.__file__}')"

          cd ..
          npx -y firebase-tools@latest deploy \
            --project "${{ env.FIREBASE_PROJECT_ID }}" \
            --only functions \
            --force
        env:
          CLOUDSDK_PYTHON: ${{ github.workspace }}/functions/venv/bin/python

      - name: Rebind Secrets to Cloud Run
        run: |
          # Firebase Deploy (Gen2) can wipe out existing secret bindings, so we re-apply them.
          gcloud run services update "${{ env.CLOUD_RUN_SERVICE }}" \
            --project "${{ env.FIREBASE_PROJECT_ID }}" \
            --region "${{ env.CLOUD_RUN_REGION }}" \
            --update-secrets "TELEGRAM_TOKEN=TELEGRAM_TOKEN:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest"
