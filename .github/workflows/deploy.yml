name: Deploy to Firebase

on: [push, workflow_dispatch]

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: '218883677076'
  CLOUD_RUN_SERVICE: 'telegram-webhook'
  CLOUD_RUN_REGION: 'us-central1'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: '${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ secrets.SERVICE_ACCOUNT_EMAIL }}'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies and Deploy
        run: |
          cd functions
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt

          # Sanity check
          python -c "import firebase_functions; print(f'SDK location: {firebase_functions.__file__}')"

          cd ..
          # Use npx -y to auto-accept install, ensure latest version
          npx -y firebase-tools@latest deploy --project ${{ env.GCP_PROJECT_ID }} --only functions --force
        env:
          # Explicitly tell gcloud/firebase which python to use if it tries to be smart
          CLOUDSDK_PYTHON: ${{ github.workspace }}/functions/venv/bin/python

      - name: Persist Secret Manager bindings
        continue-on-error: true
        run: |
          gcloud run services update ${{ env.CLOUD_RUN_SERVICE }} \
            --region ${{ env.CLOUD_RUN_REGION }} \
            --project ${{ env.GCP_PROJECT_ID }} \
            --update-secrets TELEGRAM_TOKEN=TELEGRAM_TOKEN:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest
